<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#1f232b" />
  <title>トリメモ</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./style.css?v=1.2" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="spaces-pane">
      <div class="brand">
        <div class="brand-mark">T</div>
        <div class="brand-copy">
          <strong>トリメモ</strong>
          <small>offline memo · v1.2</small>
        </div>
        <button id="collapseSpacesBtn" class="pane-collapse-btn" title="スペースを隠す">‹</button>
      </div>

      <div class="pane-title-row">
        <span>スペース</span>
        <button id="addSpaceBtn" class="icon-btn" title="スペース追加">＋</button>
      </div>

      <div id="spacesList" class="list"></div>

      <div class="utility-stack">
        <div class="theme-box">
          <div>
            <strong>テーマカラー</strong>
            <small>ボタンや選択色を変更</small>
          </div>
          <div class="theme-controls">
            <input id="themeColorInput" class="theme-color-input" type="color" value="#7c5cff" aria-label="テーマカラー" />
            <button id="resetThemeBtn" class="mini-square-btn" title="初期色に戻す">↺</button>
          </div>
        </div>

        <button id="exportBtn" class="secondary-btn">バックアップを書き出す</button>
        <label class="secondary-btn file-label">
          バックアップを読み込む
          <input id="importInput" type="file" accept="application/json,.json" hidden />
        </label>
      </div>
    </aside>

    <aside class="groups-pane">
      <div class="pane-title-row group-title-row">
        <div class="current-space-label">
          <small>現在のスペース</small>
          <strong><span id="currentSpaceIcon">🗂️</span> <span id="currentSpaceName">未選択</span></strong>
        </div>
        <div class="pane-title-actions">
          <button id="addGroupBtn" class="icon-btn" title="グループ追加">＋</button>
          <button id="collapseGroupsBtn" class="pane-collapse-btn inline" title="メモグループを隠す">‹</button>
        </div>
      </div>

      <div class="section-label">メモグループ</div>
      <div id="groupsList" class="list"></div>
    </aside>

    <main class="notes-pane">
      <header class="notes-header">
        <div class="pane-nav">
          <button id="toggleSpacesBtn" class="icon-btn" title="スペースを開く/閉じる">▣</button>
          <button id="toggleGroupsBtn" class="icon-btn" title="メモグループを開く/閉じる">#</button>
        </div>
        <div class="header-copy">
          <small>メモグループ</small>
          <h1 id="currentGroupName">グループを選択</h1>
        </div>
        <div class="header-actions">
          <input id="searchInput" class="search" type="search" placeholder="メモを検索" />
        </div>
      </header>

      <section id="emptyState" class="empty-state">
        <div class="empty-emoji">📝</div>
        <h2>トリメモへようこそ</h2>
        <p>スペースとメモグループを作って、メモを書きためられます。</p>
      </section>

      <section id="notesList" class="notes-list"></section>

      <section class="composer">
        <textarea id="noteInput" rows="3" placeholder="メモを書く…"></textarea>
        <div class="composer-row">
          <label class="attach-btn">
            📎 ファイル
            <input id="attachmentInput" type="file" multiple hidden />
          </label>
          <span id="attachmentStatus" class="attachment-status"></span>
          <button id="saveNoteBtn" class="primary-btn">保存</button>
        </div>
      </section>
    </main>
  </div>

  <div id="mediaModal" class="media-modal hidden" aria-hidden="true">
    <div class="media-modal-backdrop"></div>
    <div class="media-modal-toolbar">
      <button id="saveModalMediaBtn" class="media-toolbar-btn">保存</button>
      <button id="closeMediaModalBtn" class="media-modal-close" aria-label="閉じる">×</button>
    </div>
    <div class="media-modal-stage">
      <img id="mediaModalImg" class="media-modal-content hidden" alt="拡大画像" />
      <video id="mediaModalVideo" class="media-modal-content hidden" controls playsinline></video>
    </div>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>
  <script type="module" src="./app.js?v=1.2"></script>
</body>
</html>
